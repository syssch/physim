    <script>
        'use strict';
        const H_PLANCK = 6.62607015e-34; 
        const E_CHARGE = 1.602176634e-19; 
        const EV_TO_JOULES = E_CHARGE;
        const JOULES_TO_EV = 1 / E_CHARGE;
        const TERAHERTZ_TO_HERTZ = 1e12;
        const H_EV_PER_THZ = (H_PLANCK * TERAHERTZ_TO_HERTZ) * JOULES_TO_EV;

        const MASS_ELECTRON = 9.1093837e-31; 
        const SVG_CATHODE_SURFACE_X = 100; 
        const SVG_ANODE_SURFACE_X = 300;   
        const SVG_ELECTRON_RADIUS = 2.0; 
        const SVG_VACUUM_TUBE_Y_MIN = 90;  
        const SVG_VACUUM_TUBE_Y_MAX = 190; 
        const SVG_ACTUAL_TUBE_TOP_Y = 40;    
        const SVG_ACTUAL_TUBE_BOTTOM_Y = 220; 

        const ACTUAL_PLATE_GAP_METERS = 0.02; 
        const SVG_PLATE_GAP_PIXELS = SVG_ANODE_SURFACE_X - SVG_CATHODE_SURFACE_X;
        const SVG_PIXELS_PER_METER = SVG_PLATE_GAP_PIXELS / ACTUAL_PLATE_GAP_METERS;
        const SIM_TIME_STRETCH_FACTOR = 6e7; 
        const MAX_ELECTRONS_ON_SCREEN = 30;


        const GRAPH_Y_AXIS_MAX_IV = 0.4;
        const REFERENCE_MAX_SATURATION_CURRENT_UNITS = 20.0;
        const QUANTUM_EFFICIENCY = 0.1; 

        const GRAPH_MIN_VOLTAGE_IV = -5;
        const GRAPH_MAX_VOLTAGE_IV = 5;
        const GRAPH_POINTS_IV = 200;
        const CURRENT_AT_ZERO_VOLTAGE_RATIO = 0.8;
        const EPSILON_CURRENT_AT_V0 = 0.01;

        const KEMAX_THRESHOLD_JOULES = 1e-22; 
        const SATURATION_CURRENT_THRESHOLD_DISPLAY = 1e-9;

        const MAX_LIGHT_POWER = 1.0e-5; 

        const KE_FREQ_GRAPH_Y_MIN = -6;
        const KE_FREQ_GRAPH_Y_MAX = 8;
        const KE_FREQ_GRAPH_X_MIN = 0;

        let MIN_SLIDER_FREQUENCY_HZ;

        const METALS = {
            "Sodium (Na)": 2.28, "Cesium (Cs)": 2.14, "Potassium (K)": 2.30,
            "Calcium (Ca)": 2.87, "Copper (Cu)": 4.70, "Silver (Ag)": 4.26,
            "Zinc (Zn)": 4.33, "Gold (Au)": 5.10, "Platinum (Pt)": 5.65,
            "Aluminum (Al)": 4.08,
        };

        const frequencySlider = document.getElementById('frequency-slider');
        const intensitySlider = document.getElementById('intensity-slider');
        const voltageSlider = document.getElementById('voltage-slider');
        const metalSelect = document.getElementById('metal-select');
        const graphTypeSelect = document.getElementById('graph-type-select');
        const keFreqOptionsDiv = document.getElementById('ke-freq-options');
        const showExtrapolationCheckbox = document.getElementById('show-extrapolation-checkbox');
        const clearKePointsButton = document.getElementById('clear-ke-points-button');
        const graphTitleElement = document.getElementById('graph-title');

        const frequencyValueDisplay = document.getElementById('frequency-value');
        const intensityValueAbsDisplay = document.getElementById('intensity-value-abs');
        const photonRateDisplay = document.getElementById('photon-rate-display');
        const voltageValueDisplay = document.getElementById('voltage-value');
        const workFunctionDisplay = document.getElementById('work-function-display');
        const photonInfoDisplay = document.getElementById('photon-info-display');

        const voltageTextSvg = document.getElementById('voltage-text-svg');

        const photocurrentValuePanelDisplay = document.getElementById('photocurrent-value-panel');
        const stoppingPotentialValuePanelDisplay = document.getElementById('stopping-potential-value-panel');
        const thresholdFrequencyValuePanelDisplay = document.getElementById('threshold-frequency-value-panel');
        const keCathodeValueDisplay = document.getElementById('ke-cathode-value');
        const keAnodeValueDisplay = document.getElementById('ke-anode-value');

        const lightBeams = [
            document.getElementById('light-beam-1'),
            document.getElementById('light-beam-2'),
            document.getElementById('light-beam-3'),
        ];
        const lightSourceRect = document.querySelector('#light-source-group rect');
        const electronAnimationLayer = document.getElementById('electron-animation-layer');


        let mainChart;
        let currentGraphType = 'IV';
        let keVsFreqDataPoints = [];
        let lastAddedFrequencyForKEGraph = -1;

        let animatedElectrons = [];
        let electronAnimationRequestID;
        let lastElectronSpawnTime = 0;
        let lastFrameTime = performance.now();

        let KEMaxJoules_for_animation = 0; 
        let appliedVoltage_for_animation = 0;
        let photonEnergyJoules_for_animation = 0;
        let workFunctionJoules_for_animation = 0;
        let intensitySlider_val_for_animation = 0;
        let electricField_V_per_m_for_animation = 0;
        let emWaveType_for_animation = "";
        let effectiveSaturationVoltage_for_animation = GRAPH_MAX_VOLTAGE_IV;


        function calculateEffectiveSaturationVoltage(V0_mag, satCurrent) {
            if (V0_mag <= 0 || satCurrent < SATURATION_CURRENT_THRESHOLD_DISPLAY * 5) { 
                return GRAPH_MAX_VOLTAGE_IV; 
            }
            const targetCurrent = 0.98 * satCurrent;
            for (let v = 0.01; v <= GRAPH_MAX_VOLTAGE_IV; v += 0.05) { // Start v from a small positive to avoid issues at 0
                const currentAtV = calculatePhotocurrentAtVoltage(v, V0_mag, satCurrent);
                if (currentAtV >= targetCurrent) {
                    return Math.max(0.1, v); // Ensure it's at least a small positive voltage
                }
            }
            return GRAPH_MAX_VOLTAGE_IV; 
        }


        function spawnElectron() {
            if (animatedElectrons.length >= MAX_ELECTRONS_ON_SCREEN) return;
            if (photonEnergyJoules_for_animation <= workFunctionJoules_for_animation || KEMaxJoules_for_animation <= KEMAX_THRESHOLD_JOULES) return;

            const actual_KE_joules = Math.random() * KEMaxJoules_for_animation;
            if (actual_KE_joules < KEMAX_THRESHOLD_JOULES / 10) return; 

            const v_total_m_s = Math.sqrt(2 * actual_KE_joules / MASS_ELECTRON);
            
            const WIDE_SPREAD_START = 0.9;
            const TARGET_SPREAD_AT_SATURATION = 0.20; 
            const MIN_SPREAD_HIGH_VOLTAGE = 0.01;
            let max_angle_spread_factor = WIDE_SPREAD_START;

            if (appliedVoltage_for_animation > 0 && KEMaxJoules_for_animation > KEMAX_THRESHOLD_JOULES / 5) { // Only apply narrowing if photoemission is significant
                const V_sat_eff = effectiveSaturationVoltage_for_animation;
                if (V_sat_eff > 0.05 && V_sat_eff < GRAPH_MAX_VOLTAGE_IV) { // V_sat_eff is meaningful and not at the extreme
                    if (appliedVoltage_for_animation < V_sat_eff) {
                        const ratio = appliedVoltage_for_animation / V_sat_eff;
                        max_angle_spread_factor = WIDE_SPREAD_START - ratio * (WIDE_SPREAD_START - TARGET_SPREAD_AT_SATURATION);
                        max_angle_spread_factor = Math.max(TARGET_SPREAD_AT_SATURATION, max_angle_spread_factor);
                    } else { // appliedVoltage_for_animation >= V_sat_eff
                        const voltage_range_past_saturation = GRAPH_MAX_VOLTAGE_IV - V_sat_eff;
                        if (voltage_range_past_saturation < 0.1) { 
                            max_angle_spread_factor = MIN_SPREAD_HIGH_VOLTAGE;
                        } else {
                            const excess_voltage_ratio = Math.min(1.0, (appliedVoltage_for_animation - V_sat_eff) / voltage_range_past_saturation);
                            max_angle_spread_factor = TARGET_SPREAD_AT_SATURATION - excess_voltage_ratio * (TARGET_SPREAD_AT_SATURATION - MIN_SPREAD_HIGH_VOLTAGE);
                            max_angle_spread_factor = Math.max(MIN_SPREAD_HIGH_VOLTAGE, max_angle_spread_factor);
                        }
                    }
                } else if (V_sat_eff >= GRAPH_MAX_VOLTAGE_IV) { // Saturation is at or beyond max voltage slider
                     max_angle_spread_factor = TARGET_SPREAD_AT_SATURATION - (appliedVoltage_for_animation / GRAPH_MAX_VOLTAGE_IV) * (TARGET_SPREAD_AT_SATURATION - MIN_SPREAD_HIGH_VOLTAGE);
                     max_angle_spread_factor = Math.max(MIN_SPREAD_HIGH_VOLTAGE, max_angle_spread_factor);
                } else { // Fallback if V_sat_eff is very low or not well defined, but voltage is positive
                    max_angle_spread_factor = Math.max(MIN_SPREAD_HIGH_VOLTAGE, WIDE_SPREAD_START * (1.0 - (appliedVoltage_for_animation / GRAPH_MAX_VOLTAGE_IV)));
                }
            }
            // If appliedVoltage_for_animation <= 0, max_angle_spread_factor remains WIDE_SPREAD_START

            const ejectionAngle = (Math.random() - 0.5) * Math.PI * max_angle_spread_factor; 

            const v0x_m_s = v_total_m_s * Math.cos(ejectionAngle);
            const v0y_m_s = v_total_m_s * Math.sin(ejectionAngle);

            if (v0x_m_s <= 1e-3) return; 

            const cathode_height_svg = SVG_VACUUM_TUBE_Y_MAX - SVG_VACUUM_TUBE_Y_MIN;
            const desired_spawn_region_height_svg = cathode_height_svg / 2;
            const svg_cathode_center_y = SVG_VACUUM_TUBE_Y_MIN + cathode_height_svg / 2;
            const spawn_region_top_svg = svg_cathode_center_y - desired_spawn_region_height_svg / 2;
            const startY_svg = spawn_region_top_svg + Math.random() * desired_spawn_region_height_svg;

            const svg_y_midpoint_of_gap_plates = SVG_VACUUM_TUBE_Y_MIN + (SVG_VACUUM_TUBE_Y_MAX - SVG_VACUUM_TUBE_Y_MIN) / 2;

            const electronSVG = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            electronSVG.setAttribute("cx", SVG_CATHODE_SURFACE_X);
            electronSVG.setAttribute("cy", startY_svg);
            electronSVG.setAttribute("r", SVG_ELECTRON_RADIUS);
            electronSVG.setAttribute("fill", "cyan");
            electronAnimationLayer.appendChild(electronSVG);

            animatedElectrons.push({
                svgElement: electronSVG,
                x_m: 0, 
                y_m: (startY_svg - svg_y_midpoint_of_gap_plates) / SVG_PIXELS_PER_METER, 
                vx_m_s: v0x_m_s,
                vy_m_s: v0y_m_s,
                spawnTime: performance.now()
            });
        }

        function animateElectrons(currentTime) {
            const dt_ms = currentTime - lastFrameTime;
            lastFrameTime = currentTime;

            if (dt_ms <= 0) { 
                electronAnimationRequestID = requestAnimationFrame(animateElectrons);
                return;
            }
            const wall_dt_s = dt_ms / 1000.0; 
            const physics_dt_s = wall_dt_s / SIM_TIME_STRETCH_FACTOR; 


            const spawnIntervalBase = 200; 
            const spawnIntensityFactor = Math.max(1, intensitySlider_val_for_animation / 10); 
            const currentSpawnInterval = spawnIntervalBase / spawnIntensityFactor;

            if (currentTime - lastElectronSpawnTime > currentSpawnInterval && 
                photonEnergyJoules_for_animation > workFunctionJoules_for_animation &&
                KEMaxJoules_for_animation > KEMAX_THRESHOLD_JOULES) {
                spawnElectron();
                lastElectronSpawnTime = currentTime;
            }
            
            const ax_m_s2 = (E_CHARGE * electricField_V_per_m_for_animation) / MASS_ELECTRON;
            const svg_y_midpoint_of_gap_plates = SVG_VACUUM_TUBE_Y_MIN + (SVG_VACUUM_TUBE_Y_MAX - SVG_VACUUM_TUBE_Y_MIN) / 2;

            for (let i = animatedElectrons.length - 1; i >= 0; i--) {
                const e = animatedElectrons[i];

                e.vx_m_s += ax_m_s2 * physics_dt_s;
                e.x_m += e.vx_m_s * physics_dt_s;
                e.y_m += e.vy_m_s * physics_dt_s;

                const svg_x = SVG_CATHODE_SURFACE_X + (e.x_m * SVG_PIXELS_PER_METER);
                const svg_y = svg_y_midpoint_of_gap_plates + (e.y_m * SVG_PIXELS_PER_METER);

                e.svgElement.setAttribute("cx", svg_x.toFixed(2));
                e.svgElement.setAttribute("cy", svg_y.toFixed(2));

                let removeElectron = false;
                if (svg_x >= SVG_ANODE_SURFACE_X) { 
                    removeElectron = true;
                } else if (svg_x <= SVG_CATHODE_SURFACE_X && e.vx_m_s < 0 && e.x_m < -1e-9 ) { 
                     removeElectron = true;
                } else if (svg_y < SVG_ACTUAL_TUBE_TOP_Y || svg_y > SVG_ACTUAL_TUBE_BOTTOM_Y) { 
                    removeElectron = true;
                }
                if (currentTime - e.spawnTime > 5000) { 
                    removeElectron = true;
                }

                if (removeElectron) {
                    if(e.svgElement.parentNode === electronAnimationLayer) {
                         electronAnimationLayer.removeChild(e.svgElement);
                    }
                    animatedElectrons.splice(i, 1);
                }
            }
            electronAnimationRequestID = requestAnimationFrame(animateElectrons);
        }

        function clearAllAnimatedElectrons() {
            animatedElectrons.forEach(e => {
                if (e.svgElement && e.svgElement.parentNode === electronAnimationLayer) {
                    electronAnimationLayer.removeChild(e.svgElement);
                }
            });
            animatedElectrons = [];
        }

        function getEMWaveType(frequencyTHz) {
            if (frequencyTHz < 400) return "Infrared";
            if (frequencyTHz < 480) return "Visible (Red)";
            if (frequencyTHz < 520) return "Visible (Orange)";
            if (frequencyTHz < 600) return "Visible (Yellow)";
            if (frequencyTHz < 680) return "Visible (Green)";
            if (frequencyTHz < 750) return "Visible (Blue)";
            if (frequencyTHz < 790) return "Visible (Violet)";
            return "Ultraviolet";
        }

        function calculateLogisticTerm(ratio) {
            const minRatio = 1e-7;
            const maxRatio = 1.0 - minRatio;
            const clampedRatio = Math.max(minRatio, Math.min(maxRatio, ratio));
            return Math.log(1.0 / clampedRatio - 1.0);
        }

        function calculatePhotocurrentAtVoltage(voltagePoint, V0_magnitude, saturationCurrent) {
            const term_epsilon = calculateLogisticTerm(EPSILON_CURRENT_AT_V0);
            const term_C0 = calculateLogisticTerm(CURRENT_AT_ZERO_VOLTAGE_RATIO);

            let k_steepness = (term_epsilon - term_C0) / V0_magnitude;

            if (!isFinite(k_steepness) || Math.abs(k_steepness) < 1e-9) {
                let sign_val = Math.sign(k_steepness || (term_epsilon - term_C0) || 1);
                if (sign_val === 0) sign_val = 1; 
                k_steepness = 1e-9 * sign_val;
            }

            const V_inflection = term_C0 / k_steepness;

            const exponent = -k_steepness * (voltagePoint - V_inflection);
            const clampedExponent = Math.max(-700, Math.min(700, exponent));

            const current = saturationCurrent / (1 + Math.exp(clampedExponent));
            return Math.min(Math.max(0, current), GRAPH_Y_AXIS_MAX_IV);
        }

        function updateSimulation(forceChartUpdate = false, updateSource = null) {
            const frequencyTHz_val = parseFloat(frequencySlider.value);
            const intensitySlider_val = parseFloat(intensitySlider.value);
            const appliedVoltage_val = parseFloat(voltageSlider.value);
            const selectedMetalName_val = metalSelect.value;

            const frequencyHz_op = frequencyTHz_val * TERAHERTZ_TO_HERTZ;
            const currentPower_op = (intensitySlider_val / 100.0) * MAX_LIGHT_POWER;

            const workFunctionEv_op = METALS[selectedMetalName_val];
            const workFunctionJoules_op = workFunctionEv_op * EV_TO_JOULES;

            intensityValueAbsDisplay.textContent = (currentPower_op * 1e6).toFixed(1);
            workFunctionDisplay.textContent = `Φ: ${workFunctionEv_op.toFixed(2)} eV`;
            voltageTextSvg.textContent = `${appliedVoltage_val.toFixed(1)}V`;

            if (workFunctionJoules_op > 0 && H_PLANCK > 0) {
                const thresholdFrequencyHz_calc = workFunctionJoules_op / H_PLANCK;
                const thresholdFrequencyTHz_calc = thresholdFrequencyHz_calc / TERAHERTZ_TO_HERTZ;
                thresholdFrequencyValuePanelDisplay.textContent = thresholdFrequencyTHz_calc.toFixed(1);
            } else {
                thresholdFrequencyValuePanelDisplay.textContent = "N/A";
            }

            const photonEnergyJoules_op = H_PLANCK * frequencyHz_op;
            const photonEnergyEv_op = photonEnergyJoules_op * JOULES_TO_EV;
            const emWaveType_val = getEMWaveType(frequencyTHz_val);

            if (photonEnergyEv_op > 0) {
                photonInfoDisplay.textContent = `${photonEnergyEv_op.toFixed(2)} eV, ${emWaveType_val}`;
            } else {
                photonInfoDisplay.textContent = `N/A, ${emWaveType_val}`;
            }

            let numPhotonsIncident_op = 0;
            if (frequencyHz_op > 0 && photonEnergyJoules_op > 1e-25) {
                numPhotonsIncident_op = currentPower_op / photonEnergyJoules_op;
            }
            photonRateDisplay.textContent = numPhotonsIncident_op.toExponential(2);

            let KEMaxJoules_op = 0;
            let V0_mag_op = 0;

            if (photonEnergyJoules_op > workFunctionJoules_op) {
                KEMaxJoules_op = photonEnergyJoules_op - workFunctionJoules_op;
                if (KEMaxJoules_op > KEMAX_THRESHOLD_JOULES) {
                    V0_mag_op = KEMaxJoules_op / E_CHARGE;
                } else {
                    KEMaxJoules_op = 0;
                }
            }
            const KEMaxEv_op = KEMaxJoules_op * JOULES_TO_EV;

            let saturationCurrent_op = 0;
            if (KEMaxJoules_op > 0 && frequencyHz_op > 0 && MAX_LIGHT_POWER > 0 && MIN_SLIDER_FREQUENCY_HZ > 0) {
                saturationCurrent_op = QUANTUM_EFFICIENCY *
                                     (currentPower_op / MAX_LIGHT_POWER) *
                                     (MIN_SLIDER_FREQUENCY_HZ / frequencyHz_op) *
                                     REFERENCE_MAX_SATURATION_CURRENT_UNITS;
                saturationCurrent_op = Math.max(0, saturationCurrent_op);
                saturationCurrent_op = Math.min(saturationCurrent_op, REFERENCE_MAX_SATURATION_CURRENT_UNITS);
            }

            let actualPhotocurrent;
            if (KEMaxJoules_op <= 0 || V0_mag_op <= 0 || saturationCurrent_op < SATURATION_CURRENT_THRESHOLD_DISPLAY) {
                 actualPhotocurrent = 0;
            } else {
                 actualPhotocurrent = calculatePhotocurrentAtVoltage(appliedVoltage_val, V0_mag_op, saturationCurrent_op);
                 actualPhotocurrent = Math.max(0, actualPhotocurrent);
                 actualPhotocurrent = Math.min(actualPhotocurrent, saturationCurrent_op);
            }

            photocurrentValuePanelDisplay.textContent = actualPhotocurrent.toFixed(2);
            effectiveSaturationVoltage_for_animation = calculateEffectiveSaturationVoltage(V0_mag_op, saturationCurrent_op);


            if (V0_mag_op > 0) {
                stoppingPotentialValuePanelDisplay.textContent = `${(-V0_mag_op).toFixed(2)}`;
                keCathodeValueDisplay.textContent = KEMaxEv_op.toFixed(2);

                const stoppingPotentialActual = -V0_mag_op;
                if (appliedVoltage_val < stoppingPotentialActual) {
                    keAnodeValueDisplay.textContent = "N/A";
                } else {
                    const keAnodeJoules = KEMaxJoules_op + (E_CHARGE * appliedVoltage_val);
                    const keAnodeEv = Math.max(0, keAnodeJoules * JOULES_TO_EV);
                    keAnodeValueDisplay.textContent = keAnodeEv.toFixed(2);
                }
            } else {
                stoppingPotentialValuePanelDisplay.textContent = "N/A";
                keCathodeValueDisplay.textContent = "N/A";
                keAnodeValueDisplay.textContent = "N/A";
            }

            KEMaxJoules_for_animation = KEMaxJoules_op;
            appliedVoltage_for_animation = appliedVoltage_val;
            photonEnergyJoules_for_animation = photonEnergyJoules_op;
            workFunctionJoules_for_animation = workFunctionJoules_op;
            intensitySlider_val_for_animation = intensitySlider_val;
            electricField_V_per_m_for_animation = appliedVoltage_val / ACTUAL_PLATE_GAP_METERS;
            emWaveType_for_animation = emWaveType_val;
            
            if (forceChartUpdate) {
                clearAllAnimatedElectrons();
            }

            updateSchematicVisuals(actualPhotocurrent, intensitySlider_val / 100.0, frequencyHz_op, emWaveType_for_animation, appliedVoltage_val);

            if (currentGraphType === 'KE_FREQ' && updateSource === 'frequency' && frequencyTHz_val !== lastAddedFrequencyForKEGraph) {
                 if (KEMaxEv_op > 0) {
                    keVsFreqDataPoints.push({ x: frequencyTHz_val, y: KEMaxEv_op });
                    lastAddedFrequencyForKEGraph = frequencyTHz_val;
                    keVsFreqDataPoints.sort((a, b) => a.x - b.x);
                 }
            }

            initOrUpdateChart(
                V0_mag_op,
                saturationCurrent_op,
                KEMaxEv_op,
                appliedVoltage_val,
                workFunctionEv_op,
                frequencyTHz_val,
                forceChartUpdate
            );
        }

        function updateSchematicVisuals(photocurrent, normalizedIntensity, frequencyHz, emWaveType, appliedVoltage) {
            const lightOpacity = normalizedIntensity * 0.7 + 0.3;
            let lightColorRgbBase = "250, 204, 21";
            if (frequencyHz < 4.8e14) lightColorRgbBase = `239, 68, 68`;
            else if (frequencyHz < 5.2e14) lightColorRgbBase = `249, 115, 22`;
            else if (frequencyHz < 6.0e14) lightColorRgbBase = `234, 179, 8`;
            else if (frequencyHz < 6.8e14) lightColorRgbBase = `34, 197, 94`;
            else if (frequencyHz < 7.5e14) lightColorRgbBase = `59, 130, 246`;
            else lightColorRgbBase = `139, 92, 246`;

            lightBeams.forEach(beam => {
                beam.style.stroke = `rgba(${lightColorRgbBase}, ${lightOpacity})`;
                beam.setAttribute('stroke-width', (normalizedIntensity * 2 + 1).toString());
                beam.style.display = 'block';
                if (emWaveType === "Infrared" || emWaveType === "Ultraviolet") {
                    beam.setAttribute('stroke-dasharray', '4, 4');
                } else {
                    beam.removeAttribute('stroke-dasharray');
                }
            });

            if (lightSourceRect) {
                lightSourceRect.style.fill = `rgba(${lightColorRgbBase}, ${normalizedIntensity * 0.5 + 0.2})`;
            }

            const cathodeLabelSvg = document.getElementById('cathode-label-svg');
            const anodeLabelSvg = document.getElementById('anode-label-svg');

            if (cathodeLabelSvg && anodeLabelSvg) {
                if (appliedVoltage > 0) {
                    cathodeLabelSvg.textContent = "Cathode (-)";
                    anodeLabelSvg.textContent = "Anode (+)";
                } else if (appliedVoltage < 0) {
                    cathodeLabelSvg.textContent = "Cathode (+)";
                    anodeLabelSvg.textContent = "Anode (-)";
                } else { // appliedVoltage === 0
                    cathodeLabelSvg.textContent = "Cathode";
                    anodeLabelSvg.textContent = "Anode";
                }
            }
        }

                         mainChart.data.datasets.push({
                            label: 'Theoretical (h*f - Φ)', data: linePoints, borderColor: 'rgb(255, 99, 132)',
                            borderWidth: 2, borderDash: [5, 5], fill: false, pointRadius: 0, type: 'line', tension: 0
                        });

                        const workFunctionYIntercept = -workFunctionEv_sim;
                        if (workFunctionYIntercept >= KE_FREQ_GRAPH_Y_MIN && workFunctionYIntercept <= KE_FREQ_GRAPH_Y_MAX) {
                            annotations_ke_freq.workFunctionArrow = {
                                ...annotations_ke_freq.workFunctionArrow,
                                type: 'line', display: true,
                                xMin: KE_FREQ_GRAPH_X_MIN + (parseFloat(frequencySlider.max) - KE_FREQ_GRAPH_X_MIN) * 0.15,
                                xMax: KE_FREQ_GRAPH_X_MIN,
                                yMin: workFunctionYIntercept, yMax: workFunctionYIntercept,
                                borderColor: 'rgb(255, 159, 64)', borderWidth: 1.5,
                                arrowHeads: { end: { display: true, length: 8, width: 6, borderColor: 'rgb(255, 159, 64)', fill: true, backgroundColor: 'rgb(255, 159, 64)' }}
                            };
                            annotations_ke_freq.workFunctionLabel = {
                                ...annotations_ke_freq.workFunctionLabel,
                                type: 'label', display: true,
                                xValue: KE_FREQ_GRAPH_X_MIN + (parseFloat(frequencySlider.max) - KE_FREQ_GRAPH_X_MIN) * 0.15,
                                yValue: workFunctionYIntercept,
                                content: `(negative of) Work Function (-Φ = ${workFunctionYIntercept.toFixed(2)}eV)`,
                                color: 'rgb(255, 159, 64)', font: { size: 10, weight: 'bold' },
                                position: 'center', xAdjust: 70, yAdjust: -10,
                                padding: 3, backgroundColor: 'rgba(45, 55, 72, 0.75)'
                            };
                        }

                        const thresholdFrequencyHz_calc = (workFunctionEv_sim * EV_TO_JOULES) / H_PLANCK;
                        const thresholdFrequencyTHz_calc = thresholdFrequencyHz_calc / TERAHERTZ_TO_HERTZ;
                        const arrowTailYPos = 0.75;
                        const arrowHeadYPos = 0;
                        const graphXRange = parseFloat(frequencySlider.max) - KE_FREQ_GRAPH_X_MIN;

                        if (thresholdFrequencyTHz_calc >= KE_FREQ_GRAPH_X_MIN && thresholdFrequencyTHz_calc <= parseFloat(frequencySlider.max)) {
                            annotations_ke_freq.thresholdFrequencyArrow = {
                                ...(annotations_ke_freq.thresholdFrequencyArrow || {}), type: 'line', display: true,
                                xMin: thresholdFrequencyTHz_calc, xMax: thresholdFrequencyTHz_calc,
                                yMin: arrowHeadYPos, yMax: arrowTailYPos,
                                borderColor: 'rgb(147, 51, 234)', borderWidth: 1.5,
                                arrowHeads: { start: { display: true, length: 8, width: 6, borderColor: 'rgb(147, 51, 234)', fill: true, backgroundColor: 'rgb(147, 51, 234)' } }
                            };
                            let labelXAdjust = 0;
                            if (graphXRange > 0) {
                                if (thresholdFrequencyTHz_calc < KE_FREQ_GRAPH_X_MIN + graphXRange * 0.25) labelXAdjust = 60;
                                else if (thresholdFrequencyTHz_calc > KE_FREQ_GRAPH_X_MIN + graphXRange * 0.75) labelXAdjust = -60;
                            }
                            annotations_ke_freq.thresholdFrequencyLabel = {
                                ...(annotations_ke_freq.thresholdFrequencyLabel || {}), type: 'label', display: true,
                                xValue: thresholdFrequencyTHz_calc, yValue: arrowTailYPos,
                                content: `Threshold Frequency (f₀ = ${thresholdFrequencyTHz_calc.toFixed(1)} THz)`,
                                color: 'rgb(147, 51, 234)', font: { size: 10, weight: 'bold' },
                                position: 'center', yAdjust: -12, xAdjust: labelXAdjust,
                                padding: 3, backgroundColor: 'rgba(45, 55, 72, 0.75)'
                            };
                        }
                    }
                }
                mainChart.update('none');
            }
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
